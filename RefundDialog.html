<!DOCTYPE html>
<html><head><base target="_top"><style>body{font-family:Arial,sans-serif;padding:14px}label{display:block;margin-top:10px;font-weight:600}input,textarea{width:100%;box-sizing:border-box;padding:7px;margin-top:4px}button{margin-top:14px;padding:8px 12px}.info{margin-top:12px;padding:9px;background:#f1f3f4;border-radius:6px}</style></head>
<body>
<label>Beneficiario</label><input id="beneficiary">
<label>Importo</label><input id="amount" type="number" step="0.01">
<label>Data rimborso</label><input id="date" type="date">
<label>Note</label><textarea id="notes" rows="3"></textarea>
<div id="info" class="info">Il sistema controllerà i rimborsi già registrati per la stessa persona nello stesso evento.</div>
<button onclick="save()">Registra rimborso</button>
<script>
const EVENT_ID='<?= eventId ?>';
function save(){
 const b=document.getElementById('beneficiary').value.trim();
 const a=Number(document.getElementById('amount').value||0);
 const d=document.getElementById('date').value?new Date(document.getElementById('date').value+'T12:00:00'):new Date();
 const n=document.getElementById('notes').value;
 google.script.run.withSuccessHandler(r=>{
   let msg='Rimborso registrato. Totale per questa persona: '+r.newTotal.toFixed(2)+' €.';
   if(r.warning) msg+='\n'+r.warning;
   alert(msg); google.script.host.close();
 }).withFailureHandler(e=>alert(e.message)).registerRefund(EVENT_ID,b,a,d,n);
}
</script></body></html>
