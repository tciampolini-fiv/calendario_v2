<!DOCTYPE html>
<html><head><base target="_top"><style>body{font-family:Arial,sans-serif;padding:14px;color:#202124}label{display:block;margin-top:10px;font-weight:600}input,textarea,select{width:100%;box-sizing:border-box;padding:7px;margin-top:4px;border:1px solid #dadce0;border-radius:5px}button{margin-top:14px;padding:8px 12px}.info{margin-top:12px;padding:9px;background:#f1f3f4;border-radius:6px}.muted{color:#5f6368;font-size:12px}</style></head>
<body>
<label>Ruolo</label><select id="role"><option value="ATLETA">Atleta</option><option value="TECNICO">Tecnico</option><option value="ALTRO">Altro</option></select>
<div class="muted">Il massimale viene controllato solo per gli atleti. I tecnici non hanno massimale.</div>
<label>Beneficiario</label><input id="beneficiary">
<label>Importo</label><input id="amount" type="number" step="0.01">
<label>Data rimborso</label><input id="date" type="date">
<label>Note</label><textarea id="notes" rows="3"></textarea>
<div id="info" class="info">Il sistema controllerà anche eventuali rimborsi duplicati alla stessa persona nello stesso evento.</div>
<button onclick="save()">Registra rimborso</button>
<script>
const EVENT_ID='<?= eventId ?>';
function save(){
 const role=document.getElementById('role').value;
 const b=document.getElementById('beneficiary').value.trim();
 const a=Number(document.getElementById('amount').value||0);
 const d=document.getElementById('date').value;
 const n=document.getElementById('notes').value;
 google.script.run.withSuccessHandler(r=>{
   let msg='Rimborso registrato. Totale per questa persona: '+r.newTotal.toFixed(2)+' €.';
   if(r.warning) msg+='\n'+r.warning;
   alert(msg); google.script.host.close();
 }).withFailureHandler(e=>alert(e.message)).registerRefund(EVENT_ID,b,a,d,n,role);
}
</script></body></html>
