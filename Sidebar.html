<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    *{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;color:#202124;background:#f8f9fa}.wrap{padding:12px 12px 82px}.top{background:#fff;border:1px solid #dadce0;border-radius:10px;padding:12px;margin-bottom:10px;transition:background-color .18s ease,box-shadow .18s ease}.title{font-size:18px;font-weight:700;line-height:1.2}.meta{font-size:12px;color:#5f6368;margin-top:4px}.event-note{margin-top:7px;color:#3c4043;line-height:1.35}.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}.metric{background:#f8f9fa;border-radius:7px;padding:7px}.metric b{display:block;font-size:13px}.metric span{font-size:10px;color:#5f6368}.section{background:#fff;border:1px solid #dadce0;border-radius:10px;margin:8px 0;overflow:hidden}.section-head{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;cursor:pointer;font-weight:700}.section-body{border-top:1px solid #eee;padding:10px 12px}.hidden{display:none}.muted{color:#5f6368}.small{font-size:11px}.btn{border:1px solid #dadce0;background:white;border-radius:6px;padding:6px 9px;cursor:pointer}.btn:disabled{cursor:default;opacity:.42}.btn-primary{background:#1a73e8;color:#fff;border-color:#1a73e8}.btn-small{padding:3px 6px;font-size:11px}.toolbar{display:flex;gap:6px;margin-top:10px}.task,.expense,.person{padding:8px 0;border-bottom:1px solid #eee}.task:last-child,.expense:last-child,.person:last-child{border-bottom:0}.task.task-soon{background:#fef7e0;border-left:4px solid #f9ab00;padding-left:8px;padding-right:5px}.task.task-late{background:#fce8e6;border-left:4px solid #d93025;padding-left:8px;padding-right:5px}.row{display:flex;gap:6px;align-items:center}.grow{flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}label{display:block;font-size:11px;color:#5f6368;margin-top:5px}input,select,textarea{width:100%;border:1px solid #dadce0;border-radius:5px;padding:6px;font:inherit}input[type=checkbox]{width:auto}textarea.auto-grow{resize:none;overflow:hidden;min-height:34px;line-height:1.35}.dirty{font-size:11px;color:#b06000}.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dadce0;padding:10px 12px;box-shadow:0 -2px 8px rgba(0,0,0,.08)}.savebar button{width:100%;font-weight:700;padding:10px;transition:background-color .18s ease,transform .18s ease}.status{font-size:11px;text-align:center;margin-top:4px;min-height:13px}.loading{padding:12px;text-align:center;color:#5f6368}.danger{color:#d93025}.pill{font-size:10px;background:#f1f3f4;border-radius:10px;padding:2px 6px}.spacer{height:4px}.saved-pulse{animation:savedPulse .65s ease}.save-pulse{animation:saveButtonPulse .65s ease}@keyframes savedPulse{0%{background:#fff;box-shadow:none}35%{background:#e6f4ea;box-shadow:0 0 0 2px #34a853 inset}100%{background:#fff;box-shadow:none}}@keyframes saveButtonPulse{0%{background:#1a73e8;transform:scale(1)}35%{background:#188038;transform:scale(.985)}100%{background:#1a73e8;transform:scale(1)}}
  </style>
</head>
<body>
<div class="wrap">
  <div id="app" class="loading">Caricamento evento selezionato…</div>
</div>
<div class="savebar">
  <button id="saveBtn" class="btn btn-primary" onclick="saveAll()" disabled>SALVA MODIFICHE</button>
  <div id="saveStatus" class="status muted"></div>
</div>
<script>
let state={shell:null,checklist:null,expenses:null,participants:null,loaded:{checklist:false,expenses:false,participants:false},dirty:false,draft:{checklistUpdates:{},newChecklist:[],deletedChecklistIds:[],expenseUpdates:{},newExpenses:[],newRefunds:[],refundLimitChange:null}};
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function money(v){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(v||0));}
function dateFmt(v){if(!v)return '';const d=new Date(v);if(isNaN(d))return String(v);return new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'short'}).format(d).replace(/\./g,'');}
function iso(v){if(!v)return '';const d=new Date(v);if(isNaN(d))return '';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function done(s){return ['FATTO','COMPLETATA'].includes(String(s||'').toUpperCase());}
function taskDeadlineClass(status,dueDate){if(done(status)||!dueDate)return '';const s=String(dueDate).slice(0,10);const p=s.split('-').map(Number);if(p.length!==3||!p[0]||!p[1]||!p[2])return '';const due=new Date(p[0],p[1]-1,p[2]);const today=new Date();today.setHours(0,0,0,0);const days=Math.round((due-today)/86400000);if(days<0)return 'task-late';if(days<=3)return 'task-soon';return '';}
function autoGrow(el){if(!el)return;el.style.height='auto';el.style.height=Math.max(34,el.scrollHeight)+'px';}
function growAllNotes(){requestAnimationFrame(()=>document.querySelectorAll('textarea.auto-grow').forEach(autoGrow));}
function markDirty(){state.dirty=true;const b=document.getElementById('saveBtn');b.disabled=false;b.classList.remove('save-pulse');document.getElementById('saveStatus').innerHTML='<span class="dirty">Modifiche non salvate</span>';}
function resetDraft(){state.draft={checklistUpdates:{},newChecklist:[],deletedChecklistIds:[],expenseUpdates:{},newExpenses:[],newRefunds:[],refundLimitChange:null};state.dirty=false;document.getElementById('saveBtn').disabled=true;document.getElementById('saveStatus').textContent='';}
function showError(e){document.getElementById('saveStatus').innerHTML='<span class="danger">'+esc(e?.message||e)+'</span>';document.getElementById('saveBtn').disabled=!state.dirty;}
function focusCurrentRow(){if(!state.shell)return;google.script.run.focusPanelEventRow(state.shell.row,state.shell.eventId);}
function pulseSaved(){const top=document.querySelector('.top'),btn=document.getElementById('saveBtn');if(top){top.classList.remove('saved-pulse');void top.offsetWidth;top.classList.add('saved-pulse');}btn.classList.remove('save-pulse');void btn.offsetWidth;btn.classList.add('save-pulse');setTimeout(()=>{top?.classList.remove('saved-pulse');btn.classList.remove('save-pulse');},700);}
function loadSelected(){if(state.dirty&&!confirm('Ci sono modifiche non salvate. Vuoi scartarle e caricare la riga selezionata?'))return;document.getElementById('app').innerHTML='<div class="loading">Caricamento evento selezionato…</div>';google.script.run.withSuccessHandler(shell=>{if(!shell||shell.state!=='EVENT'){document.getElementById('app').innerHTML='<div class="top">'+esc(shell?.message||'Seleziona una riga evento nel Calendario.')+'<div class="toolbar"><button class="btn" onclick="loadSelected()">Riprova</button></div></div>';return;}state.shell=shell;state.checklist=null;state.expenses=null;state.participants=null;state.loaded={checklist:false,expenses:false,participants:false};resetDraft();renderShell();focusCurrentRow();}).withFailureHandler(showError).getSelectedEventShell();}
function renderShell(){const s=state.shell,e=s.event||{},m=s.summary||{};const title=[e['TIPO'],e['CLASSE']].filter(Boolean).join(' · ')||'Evento';const eventNote=String(e['NOTE EVENTO']||'').trim();document.getElementById('app').innerHTML=`<div class="top"><div class="title">${esc(title)}</div><div class="meta">${dateFmt(e['DATA INIZIO'])} – ${dateFmt(e['DATA FINE'])} · ${esc(e["LOCALITA'"]||'')}</div>${eventNote?`<div class="meta event-note">${esc(eventNote)}</div>`:''}<div class="summary"><div class="metric"><b>${esc(m.checklist||'-')}</b><span>Checklist</span></div><div class="metric"><b>${money(m.budget)}</b><span>Preventivo</span></div><div class="metric"><b>${money(m.toPay)}</b><span>Da saldare</span></div></div><div class="toolbar"><button class="btn" onclick="loadSelected()">Carica riga selezionata</button></div></div>${sectionHtml('checklist','Checklist',esc(m.nextAction||'Apri per vedere le attività'))}${sectionHtml('expenses','Spese e rimborsi','Carica solo quando serve')}${sectionHtml('participants','Partecipanti','Carica elenco')}`;}
function sectionHtml(id,title,sub){return `<div class="section"><div class="section-head" onclick="toggleSection('${id}')"><div>${title}<div class="small muted">${sub}</div></div><span>›</span></div><div id="${id}Body" class="section-body hidden"></div></div>`;}
function toggleSection(id){const body=document.getElementById(id+'Body');if(!body)return;body.classList.toggle('hidden');if(body.classList.contains('hidden')||state.loaded[id])return;body.innerHTML='<div class="loading">Caricamento…</div>';if(id==='checklist')google.script.run.withSuccessHandler(d=>{state.checklist=d.checklist||[];state.loaded.checklist=true;renderChecklist();}).withFailureHandler(showError).getPanelChecklistSection(state.shell.eventId);if(id==='expenses')google.script.run.withSuccessHandler(d=>{state.expenses=d;state.loaded.expenses=true;renderExpenses();}).withFailureHandler(showError).getPanelExpensesSection(state.shell.eventId,state.shell.row);if(id==='participants')google.script.run.withSuccessHandler(d=>{state.participants=d.participants||[];state.loaded.participants=true;renderParticipants();}).withFailureHandler(showError).getPanelParticipantsSection(state.shell.eventId);}
function renderChecklist(){const body=document.getElementById('checklistBody');const list=(state.checklist||[]).filter(x=>!state.draft.deletedChecklistIds.includes(String(x.id)));body.innerHTML=(list.length?list.map(t=>{const u=state.draft.checklistUpdates[t.id]||{};const status=u.status??t.status;const due=u.dueDate??iso(t.dueDate);const urgency=taskDeadlineClass(status,due);return `<div class="task ${urgency}"><div class="row"><input type="checkbox" ${done(status)?'checked':''} onchange="taskChange('${esc(t.id)}','status',this.checked?'FATTO':'DA FARE')"><div class="grow"><b>${esc(t.task)}</b><div class="small muted">${urgency==='task-late'?'SCADUTA · ':urgency==='task-soon'?'IMMINENTE · ':''}${esc(t.priority||'')} ${t.source?'· '+esc(t.source):''}</div></div><button class="btn btn-small danger" onclick="deleteTaskDraft('${esc(t.id)}')">×</button></div><div><label>Scadenza</label><input type="date" value="${esc(due)}" onchange="taskChange('${esc(t.id)}','dueDate',this.value)"></div><div><label>Note</label><textarea class="auto-grow" rows="1" oninput="autoGrow(this);taskChange('${esc(t.id)}','note',this.value)">${esc(u.note??t.note??'')}</textarea></div></div>`;}).join(''):'<div class="muted small">Nessuna attività.</div>')+`<div id="newTasks">${state.draft.newChecklist.map((t,i)=>newTaskHtml(t,i)).join('')}</div><button class="btn" onclick="addTaskDraft()">+ Aggiungi attività</button>`;growAllNotes();}
function taskChange(id,key,val){state.draft.checklistUpdates[id]=state.draft.checklistUpdates[id]||{id:id};state.draft.checklistUpdates[id][key]=val;markDirty();if(key==='dueDate'||key==='status')renderChecklist();}
function deleteTaskDraft(id){if(!state.draft.deletedChecklistIds.includes(String(id)))state.draft.deletedChecklistIds.push(String(id));delete state.draft.checklistUpdates[id];markDirty();renderChecklist();}
function addTaskDraft(){state.draft.newChecklist.push({task:'Nuova attività',dueDate:'',priority:'NORMALE',note:'',status:'DA FARE'});markDirty();renderChecklist();}
function newTaskHtml(t,i){const urgency=taskDeadlineClass(t.status,t.dueDate);return `<div class="task ${urgency}"><div class="row"><div class="grow"><input value="${esc(t.task)}" onchange="newTaskChange(${i},'task',this.value)"></div><button class="btn btn-small danger" onclick="removeNewTask(${i})">×</button></div><div class="grid2"><div><label>Scadenza</label><input type="date" value="${esc(t.dueDate||'')}" onchange="newTaskChange(${i},'dueDate',this.value)"></div><div><label>Priorità</label><select onchange="newTaskChange(${i},'priority',this.value)"><option ${t.priority==='NORMALE'?'selected':''}>NORMALE</option><option ${t.priority==='ALTA'?'selected':''}>ALTA</option><option ${t.priority==='BASSA'?'selected':''}>BASSA</option></select></div></div><label>Note</label><textarea class="auto-grow" rows="1" oninput="autoGrow(this);newTaskChange(${i},'note',this.value)">${esc(t.note||'')}</textarea></div>`;}
function newTaskChange(i,k,v){state.draft.newChecklist[i][k]=v;markDirty();if(k==='dueDate'||k==='status')renderChecklist();}function removeNewTask(i){state.draft.newChecklist.splice(i,1);markDirty();renderChecklist();}
function renderExpenses(){const body=document.getElementById('expensesBody'),d=state.expenses||{},all=d.expenses||[],sp=all.filter(x=>String(x.type).toUpperCase()!=='RIMBORSO'),rf=all.filter(x=>String(x.type).toUpperCase()==='RIMBORSO'),lim=(state.draft.refundLimitChange&&state.draft.refundLimitChange.mode==='SET')?state.draft.refundLimitChange.value:(d.refundLimit?.value||0);body.innerHTML=`<div class="task"><b>Massimale atleta</b><div class="row"><input id="refundLimit" type="number" value="${esc(lim)}" onchange="refundLimitSet(this.value)"><button class="btn btn-small" onclick="refundLimitReset()">Standard</button></div><div class="small muted">Standard: ${money(d.standardRefundLimit||0)} · Tecnici senza limite</div></div><b>Spese</b>${sp.length?sp.map(expenseHtml).join(''):'<div class="small muted">Nessuna spesa registrata.</div>'}${state.draft.newExpenses.map((x,i)=>newExpenseHtml(x,i)).join('')}<button class="btn" onclick="addExpenseDraft()">+ Aggiungi spesa</button><div class="spacer"></div><b>Rimborsi</b>${rf.length?rf.map(r=>`<div class="expense"><div class="row"><span class="grow">${esc(r.beneficiary)}</span><b>${money(r.actual)}</b></div><div class="small muted">${dateFmt(r.paidDate)} · ${esc(r.category||'')}</div></div>`).join(''):'<div class="small muted">Nessun rimborso.</div>'}${state.draft.newRefunds.map((x,i)=>newRefundHtml(x,i)).join('')}<button class="btn" onclick="addRefundDraft()">+ Aggiungi rimborso</button>`;}
function expenseHtml(x){const u=state.draft.expenseUpdates[x.id]||{};return `<div class="expense"><div class="row"><b class="grow">${esc(x.description||x.category||'Spesa')}</b><span class="pill">${esc(u.status??x.status??'')}</span></div><div class="grid2"><div><label>Effettivo</label><input type="number" step="0.01" value="${esc(u.actual??x.actual??0)}" onchange="expenseChange('${esc(x.id)}','actual',this.value)"></div><div><label>Scadenza</label><input type="date" value="${esc(u.dueDate??iso(x.dueDate))}" onchange="expenseChange('${esc(x.id)}','dueDate',this.value)"></div></div><label>Stato</label><select onchange="expenseChange('${esc(x.id)}','status',this.value)">${['DA DEFINIRE','DA PAGARE','AFOR FATTO','PAGATO CON CC','INVIATO IN AMMINISTRAZIONE','CHIUSO'].map(s=>`<option ${(u.status??x.status)===s?'selected':''}>${s}</option>`).join('')}</select><div class="row"><label class="grow"><input type="checkbox" ${(u.invoiceReceived??x.invoiceReceived)?'checked':''} onchange="expenseChange('${esc(x.id)}','invoiceReceived',this.checked)"> Fattura ricevuta</label><label class="grow"><input type="checkbox" ${(u.receiptRequested??x.receiptRequested)?'checked':''} onchange="expenseChange('${esc(x.id)}','receiptRequested',this.checked)"> Contabile richiesta</label></div></div>`;}
function expenseChange(id,k,v){state.draft.expenseUpdates[id]=state.draft.expenseUpdates[id]||{id:id};state.draft.expenseUpdates[id][k]=v;markDirty();}
function refundLimitSet(v){state.draft.refundLimitChange={mode:'SET',value:Number(v||0)};markDirty();}function refundLimitReset(){state.draft.refundLimitChange={mode:'RESET'};markDirty();if(state.expenses){state.expenses.refundLimit={value:state.expenses.standardRefundLimit,source:'STANDARD'};}renderExpenses();}
function addExpenseDraft(){const opts=(state.expenses?.cebOptions||[]).filter(o=>String(o.recordType||'').toUpperCase()!=='RIMBORSO');state.draft.newExpenses.push({description:'',category:'VITTO / ALLOGGIO',ceb:opts[0]?.code||'',beneficiary:'',budget:'',actual:'',dueDate:'',status:'DA DEFINIRE',rifStatus:'NON NECESSARIO',rifCode:'',invoiceReceived:false,receiptRequested:false,notes:''});markDirty();renderExpenses();}
function newExpenseHtml(x,i){const opts=(state.expenses?.cebOptions||[]).filter(o=>String(o.recordType||'').toUpperCase()!=='RIMBORSO');return `<div class="expense"><label>Descrizione</label><input value="${esc(x.description)}" onchange="newExpenseChange(${i},'description',this.value)"><div class="grid2"><div><label>Categoria</label><select onchange="newExpenseChange(${i},'category',this.value)">${['VITTO / ALLOGGIO','VIAGGI','COMPENSI / RIMBORSI','NOLEGGI','ISCRIZIONI','TRASPORTO','ALTRO'].map(s=>`<option ${x.category===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>CEB</label><select onchange="newExpenseChange(${i},'ceb',this.value)">${opts.map(o=>`<option value="${esc(o.code)}" ${x.ceb===o.code?'selected':''}>${esc(o.code)}</option>`).join('')}</select></div></div><label>Fornitore</label><input value="${esc(x.beneficiary)}" onchange="newExpenseChange(${i},'beneficiary',this.value)"><div class="grid2"><div><label>Preventivo</label><input type="number" step="0.01" value="${esc(x.budget)}" onchange="newExpenseChange(${i},'budget',this.value)"></div><div><label>Effettivo</label><input type="number" step="0.01" value="${esc(x.actual)}" onchange="newExpenseChange(${i},'actual',this.value)"></div></div><label>Scadenza</label><input type="date" value="${esc(x.dueDate)}" onchange="newExpenseChange(${i},'dueDate',this.value)"><button class="btn btn-small danger" onclick="removeNewExpense(${i})">Rimuovi</button></div>`;}
function newExpenseChange(i,k,v){state.draft.newExpenses[i][k]=v;markDirty();}function removeNewExpense(i){state.draft.newExpenses.splice(i,1);markDirty();renderExpenses();}
function addRefundDraft(){state.draft.newRefunds.push({role:'ATLETA',beneficiary:'',amount:'',paidDate:'',notes:'',confirmedOverLimit:false});markDirty();renderExpenses();}
function newRefundHtml(x,i){return `<div class="expense"><div class="grid2"><div><label>Ruolo</label><select onchange="newRefundChange(${i},'role',this.value)"><option ${x.role==='ATLETA'?'selected':''}>ATLETA</option><option ${x.role==='TECNICO'?'selected':''}>TECNICO</option><option ${x.role==='ALTRO'?'selected':''}>ALTRO</option></select></div><div><label>Importo</label><input type="number" step="0.01" value="${esc(x.amount)}" onchange="newRefundChange(${i},'amount',this.value)"></div></div><label>Beneficiario</label><input value="${esc(x.beneficiary)}" onchange="newRefundChange(${i},'beneficiary',this.value)"><label>Data</label><input type="date" value="${esc(x.paidDate)}" onchange="newRefundChange(${i},'paidDate',this.value)"><label><input type="checkbox" ${x.confirmedOverLimit?'checked':''} onchange="newRefundChange(${i},'confirmedOverLimit',this.checked)"> Confermo eventuale superamento massimale</label><button class="btn btn-small danger" onclick="removeNewRefund(${i})">Rimuovi</button></div>`;}
function newRefundChange(i,k,v){state.draft.newRefunds[i][k]=v;markDirty();}function removeNewRefund(i){state.draft.newRefunds.splice(i,1);markDirty();renderExpenses();}
function renderParticipants(){const body=document.getElementById('participantsBody'),p=state.participants||[];body.innerHTML=p.length?p.map(x=>`<div class="person"><b>${esc((x.name||'')+' '+(x.surname||''))}</b><div class="small muted">${esc(x.club||'')} ${x.role?'· '+esc(x.role):''}${x.email?' · '+esc(x.email):''}</div></div>`).join(''):'<div class="small muted">Nessun partecipante importato.</div>';}
function saveAll(){if(!state.dirty||!state.shell)return;const btn=document.getElementById('saveBtn');btn.disabled=true;document.getElementById('saveStatus').textContent='';const payload={eventId:state.shell.eventId,row:state.shell.row,checklistUpdates:Object.values(state.draft.checklistUpdates),newChecklist:state.draft.newChecklist,deletedChecklistIds:state.draft.deletedChecklistIds,expenseUpdates:Object.values(state.draft.expenseUpdates),newExpenses:state.draft.newExpenses,newRefunds:state.draft.newRefunds,refundLimitChange:state.draft.refundLimitChange,returnChecklist:state.loaded.checklist,returnExpenses:state.loaded.expenses};google.script.run.withSuccessHandler(r=>{state.shell=r.shell||state.shell;if(r.checklist){state.checklist=r.checklist;state.loaded.checklist=true;}if(r.expensesSection){state.expenses=r.expensesSection;state.loaded.expenses=true;}resetDraft();renderShell();if(state.loaded.checklist){document.getElementById('checklistBody').classList.remove('hidden');renderChecklist();}if(state.loaded.expenses){document.getElementById('expensesBody').classList.remove('hidden');renderExpenses();}focusCurrentRow();pulseSaved();}).withFailureHandler(showError).saveEventPanelDraft(payload);}
loadSelected();
</script>
</body>
</html>
